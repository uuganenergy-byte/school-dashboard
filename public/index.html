<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тэмүүжин Сургууль</title>
  
  <link rel="stylesheet" href="style.css">
  
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
  <script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>
  
  <script src="index.js" defer></script>
</head>
<body>

<header class="header-3col">
  <h1>🏫 Тэмүүжин Сургуулийн мэдээлэл</h1>
  <div class="header-nav">
    <button type="button" class="nav-btn active" id="navHome" onclick="showMainView('home')">🏠 Нүүр</button>
    <button type="button" class="nav-btn" id="navSchedule" onclick="showMainView('schedule')">📅 Хуваарь харах</button>
    <button type="button" class="nav-btn" id="navPhones" onclick="showMainView('phones')">📞 Утасны жагсаалт</button>
    <button type="button" class="nav-btn" id="navWeb" onclick="showMainView('web')">🌐 Веб хуудас</button>
    <button type="button" class="nav-btn" id="navKherlen" onclick="showMainView('kherlen')">📍 Хэрлэн сум</button>
  </div>
  <div class="header-right">
    <div class="clock" id="clock">00:00:00</div>
    <a href="/admin.html" class="admin-gear-btn" title="Админ систем руу очих">⚙️</a>
  </div>
</header>

<!-- 🧑‍🏫 Жижүүр багш (админы "Жижүүр багшийн хуваарь"-аас) -->
<div id="dutyStrip" class="duty-strip" style="display:none;"></div>

<div class="dashboard-grid">

  <!-- 1-р эгнээ: 1-р давхар, 3D, 2-р давхар харуулах үндсэн хэсэг -->
  <main class="main-content">
    <div class="plan-dashboard">
      
      <!-- ЗҮҮН: 1-р давхар -->
      <div class="plan-card floor-1">
        <div class="card-header">
          <h3>1-р давхар (2D)</h3>
        </div>
        <div class="media-container">
          <div id="floor1Wrapper" class="floor-container-wrapper">
            <img id="floor1Image" src="/uploads/1stfloor.png" alt="1-р давхар" />
            <div id="floor1Markers"></div>
          </div>
        </div>
      </div>

      <!-- БАРУУН: 2-р давхар -->
      <div class="plan-card floor-2">
        <div class="card-header">
          <h3>2-р давхар (2D)</h3>
        </div>
        <div class="media-container">
          <div id="floor2Wrapper" class="floor-container-wrapper">
            <img id="floor2Image" src="/uploads/2ndfloor.png" alt="2-р давхар" />
            <div id="floor2Markers"></div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- 2-р эгнээ (Багана 1): Анги Сонгох -->
  <div class="box box-kabinet">
    <div class="box-title">🏫 Анги сонгох</div>
    <select id="kioskRoomSelect" class="room-select-box" onchange="onRoomChange()">
      <option value="">-- Уншиж байна... --</option>
    </select>
    <div id="roomDetailInfo" style="flex: 1;"></div>
  </div>

  <!-- 3-р эгнээ (Багана 1 - Анги сонгох хэсгийн доор): Хичээлийн хуваарь -->
  <div class="box box-angi-huvaari">
    <div class="sticky-day-head">
    <div class="box-title" id="schedTitle">📋 Хичээлийн хуваарь</div>
    <div class="btn-group">
      <button class="tab-btn day-btn" onclick="changeDay('Даваа')">Даваа</button>
      <button class="tab-btn day-btn" onclick="changeDay('Мягмар')">Мягмар</button>
      <button class="tab-btn day-btn" onclick="changeDay('Лхагва')">Лхагва</button>
      <button class="tab-btn day-btn" onclick="changeDay('Пүрэв')">Пүрэв</button>
      <button class="tab-btn day-btn" onclick="changeDay('Баасан')">Баасан</button>
    </div>
    </div>
    <div id="schedTableBox" style="overflow-x: auto;"></div>
  </div>

  <!-- 2-р эгнээ (Багана 2): Багш нар (багшийн бүртгэлээс автоматаар гарна) -->
  <div class="box box-bagsh">
    <div class="box-title">👨‍🏫 Багшийн мэдээлэл</div>
    <div id="teacherList"></div>
  </div>

  <!-- 2-р эгнээ (Багана 3): Ангийн зураг -->
  <div class="box box-zurguud">
    <div class="box-title">📷 Ангийн зураг</div>
    <div class="btn-group">
      <button class="tab-btn active img-btn" onclick="toggleImg('pano')">360° Панорама</button>
      <button class="tab-btn img-btn" onclick="toggleImg('real')">Бодит зураг</button>
    </div>
    <div id="panoBox"><div id="panorama-container"></div></div>
    <div id="realBox" style="display:none; height: 250px; background:#0f172a; text-align:center;">
      <div class="room-slider-container">
        <button class="slider-btn prev-btn" id="prevImgBtn" onclick="changeImage(-1)">❮</button>
        <img id="kioskRoomImg" src="" alt="Ангийн зураг">
        <button class="slider-btn next-btn" id="nextImgBtn" onclick="changeImage(1)">❯</button>
        <div class="slider-dots" id="sliderDots"></div>
      </div>
    </div>
  </div>

  <!-- 2-р эгнээ (Багана 3, Ангийн зургийн доор): 3D Харагдац -->
  <div class="box box-model3d">
    <div class="box-title">🧊 3D Харагдац</div>
    <model-viewer
      id="model3DViewer"
      src="/uploads/plan.glb"
      auto-rotate
      camera-controls
      shadow-intensity="1.5"
      exposure="1.2">
    </model-viewer>
  </div>
</div>


<!-- ================================================ -->
<!-- 📅 ХУВААРЬ ХАРАХ ЦЭС -->
<!-- ================================================ -->
<div id="scheduleView" class="schedule-view" style="display: none;">
  <aside class="sv-sidebar">
    <div class="sv-sidebar-title">📅 Хуваарь харах</div>
    <button type="button" class="sv-menu-btn active" data-action="sub" data-sub="teacher">👨‍🏫 Багшаар харах</button>
    <button type="button" class="sv-menu-btn" data-action="sub" data-sub="class">🏫 Ангиар харах</button>
    <button type="button" class="sv-menu-btn" data-action="sub" data-sub="day">📆 Өдрөөр харах</button>
    <button type="button" class="sv-menu-btn" data-action="sub" data-sub="now">🟢 Яг одоо хичээлтэй байгаа багш нар</button>
	<button type="button" class="sv-menu-btn" data-action="sub" data-sub="weekly">📅 7 хоногоор харах</button>
    <button type="button" class="sv-menu-btn" data-action="sub" data-sub="duty">🧑‍🏫 Жижүүр багшийн хуваарь</button>
  </aside>
  <section class="sv-content" id="svContent"></section>
</div>


<!-- ================================================ -->
<!-- 📍 ХЭРЛЭН СУМ ЦЭС -->
<!-- ================================================ -->
<div id="kherlenView" class="schedule-view" style="display: none;">
  <aside class="sv-sidebar">
    <div class="sv-sidebar-title">📍 Хэрлэн сум</div>
    <button type="button" class="sv-menu-btn active" data-kmap="k">🛰️ Хиймэл дагуулын зураг</button>
    <button type="button" class="sv-menu-btn" data-kmap="m">🗺️ Газрын зураг</button>
    <button type="button" class="sv-menu-btn" data-kmap="open">↗️ Google Maps дээр нээх</button>
  </aside>
  <section class="sv-content" style="padding:0; overflow:hidden;">
    <iframe id="kherlenMap" style="width:100%; height:calc(100vh - 150px); min-height:480px; border:0; display:block;"
      loading="lazy" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>
  </section>
</div>

<!-- ================================================ -->
<!-- 📞 УТАСНЫ ЖАГСААЛТ ЦЭС -->
<!-- ================================================ -->
<div id="phonesView" class="schedule-view" style="display: none; grid-template-columns: 1fr;">
  <div class="box" style="background: #1e293b; padding: 20px;">
    <div class="box-title">📞 Багш ажилчдын утасны жагсаалт</div>
    <div id="phonesGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; margin-top: 15px;"></div>
  </div>
</div>

</body>
</html>
